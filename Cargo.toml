[workspace]
members = ["lib", "wasm", "napi", "app", "mirror"]
default-members = ["lib"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/colonelpanic8/scrobble-scrubber"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

#
# NOTE: When iterating on local `lastfm-edit` changes, you can temporarily add a
# `[patch.crates-io]` override here.

[patch.crates-io]
# Local development override (keep this while iterating on `lastfm-edit` changes).
lastfm-edit = { path = "/home/imalison/Projects/lastfm-edit" }
